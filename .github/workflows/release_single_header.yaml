name: Release Single Header
on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: Create release with single header
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate single header
        run: |
          python3 generate_single_header.py
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/hector_ros2_utils.hpp \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
